stages: [check]

precommit:
  stage: check
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  script:
    - pip install pre-commit
    - |
      for hook in check-ast check-merge-conflict check-yaml end-of-file-fixer trailing-whitespace check-executables-have-shebangs check-added-large-files codespell check-build-config run-check-config-h run-check-forbidden-flags run-check-ascii check-forbidden check-binaries-conf check-inlined-macros; do
        pre-commit run "$hook" --from-ref "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to-ref "$CI_COMMIT_SHA"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
