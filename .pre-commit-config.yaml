#exclude: ^(docs|tests/files|tasks.py)

ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: pre-commit auto-fixes
  autoupdate_commit_msg: pre-commit autoupdate

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
      # Style, newline and spell checks run only on source code files.
      # Data files (pseudopotentials, test inputs and reference outputs) are never touched.
      - id: end-of-file-fixer
        files: &source_files '\.(F90|f90|f|finc|h|c|cpp|hpp|py|sh|bash|mk|m4|ac|am|cmake)$|(^|/)CMakeLists\.txt$'
      - id: trailing-whitespace
        files: *source_files
      - id: mixed-line-ending
        args: [--fix=lf]
        files: *source_files
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: ['--maxkb=15000']  # 15 MB cap

